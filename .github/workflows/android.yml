
name: Android Build Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang \
            libsdl3-dev libgl-dev

      - name: Verificar configuração CMake
        run: |
          cmake -S . -B build -G Ninja
          
